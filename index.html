{id:1,l:0,n:1,ru:"Чёрт возьми, Генри, откуда тут столько чёрной жижи?",en:"Damn it, Henry, where did all this black goo come from?"},
{id:2,l:0,n:2,ru:"Аолооалооалраорполоалоаоолрпропло",en:"Аолооалооалраорполоалоаоолрпропло"},
{id:3,l:0,n:3,ru:"Стены здесь шевелятся, когда на них не смотришь. Сегодня насчитал на одну дверь больше, чем вчера. Генри говорит, что я просто устал.\n\nГенри, ты вообще где?",en:"The walls move when you are not looking at them. Today I counted one more door than yesterday. Henry says I am just tired.\n\nHenry, where are you, anyway?"},
{id:4,l:0,n:4,ru:"Сегодня пришёл в подземелье. Знаю, тут мало что можно съесть, но другого выбора нет.",en:"Came to the dungeon today. I know there is hardly anything to eat here, but I have no other choice."},
{id:5,l:1,n:1,ru:"^ПОТЕРЯЛСЯ ПИТОМЕЦ\n\nКрасный бык, очень миленький и добренький.\n\nВ последний раз его видели в загоне.",en:"^LOST PET\n\nRed bull, very cute and sweet.\n\nLast seen in the pen."},
{id:6,l:1,n:2,ru:"Твою мать, мы идём по этим болотам уже третью неделю! Пришлю тебе ещё письмо, когда выберемся.",en:"Damn it all, we have been walking through these swamps for three weeks now! I will send you another letter when we get out."},
{id:7,l:1,n:3,ru:"Видел в болоте волшебницу в остроконечной шляпе. Она скользила прямо по трясине и даже не промокла, а лягушки расступались перед ней, как перед королевой. Я окликнул её, а она только качнулась, и по воде побежала молния.\n\nБольше я к ней не подходил.",en:"I saw a sorceress in a pointed hat in the swamp. She glided right over the bog and did not even get wet, and the frogs made way for her like for a queen. I called out to her, and she only gave a little wobble, and lightning ran across the water.\n\nI did not go near her again."},
{id:8,l:2,n:1,ru:"Исследование пещер идёт отлично! Найдены странные сущности, их отправили в лабораторию. Температура здесь крайне высокая, находиться тут долго опасно.",en:"The cave survey is going great! Strange creatures were found and sent to the laboratory. The temperature here is extremely high, staying here for long is dangerous."},
{id:9,l:2,n:2,ru:"Совет новичкам: не подпускайте духов огня близко. Они так здороваются. С разбега. Со взрывом.\n\nПроверено. Скол на углу заживёт через месяц.",en:"Advice for newcomers: do not let the fire spirits come close. That is how they say hello. At a run. With an explosion.\n\nTested. The chip on my corner will heal in a month."},
{id:10,l:2,n:3,ru:"Видел на краю лавы какого-то типа в мантии. Стоит и раскачивается, а из пола вылезают твари, одна за другой. Я подождал, пока он закончит, но он не закончил.\n\nПишу, чтобы вы туда не лезли. Это Призыватель. Он зовёт друзей быстрее, чем вы успеваете их убить.",en:"I saw some guy in a robe at the edge of the lava. He just stands there swaying while creatures crawl out of the floor one after another. I waited for him to finish, but he never did.\n\nI am writing so that you do not go there. It is the Summoner. He calls his friends faster than you can kill them."},
{id:11,l:3,n:1,ru:"Мы стащили какое-то зелье у папы, но случайно разлили его на снег, и теперь тут злые снеговики!",en:"We stole some potion from Dad, but accidentally spilled it on the snow, and now there are angry snowmen here!"},
{id:12,l:3,n:2,ru:"Снеговики стреляют крестом. Если стоять по диагонали, ничего не прилетит. Проверено на себе.\n\nПравда, лёд скользкий, и стоять на месте почти невозможно.",en:"The snowmen shoot in a cross. If you stand diagonally, nothing will hit you. Tested on myself.\n\nThe ice is slippery though, and standing still is almost impossible."},
{id:13,l:5,n:1,ru:"Не знаю, вернусь ли я домой, но король сошёл с ума!\n\nОн приказывает нам отправиться в Пустоту! А в случае неповиновения — казнь!",en:"I do not know if I will ever come home, but the king has gone mad!\n\nHe orders us to go to the Void! And if we disobey, execution!"},
{id:14,l:5,n:2,ru:"Я смог сбежать! Но теперь я в розыске. Попробую спрятаться в подземелье.",en:"I managed to escape! But now I am wanted. I will try to hide in the dungeon."},
{id:15,l:5,n:3,ru:"^ПРИКАЗ КОРОЛЯ\n\nМой сын, принц, пропал. Найти его! Обыскать замок, подземелье, болота и пещеры. Заглянуть в каждый угол, в каждую щель.\n\nТот, кто вернёт его, получит золото. Тот, кто вернётся без него, не вернётся вовсе.\n\n>— КОРОЛЬ",en:"^ROYAL ORDER\n\nMy son, the prince, is missing. Find him! Search the castle, the dungeon, the swamps and the caves. Look into every corner, every crack.\n\nWhoever brings him back will receive gold. Whoever returns without him will not return at all.\n\n>— THE KING"},
{id:16,l:5,n:4,ru:"Придворный маг заперся в башне и шепчется с Пустотой. Стража боится собственных теней. А по ночам по залам ходит кто-то в короне, хотя король в это время спит.\n\nИли не спит.",en:"The court mage has locked himself in the tower and whispers to the Void. The guards are afraid of their own shadows. And at night someone in a crown walks the halls, even though the king is asleep at that hour.\n\nOr is he?"},
{id:17,l:6,n:1,ru:"^ОТЧЁТ №1\n\nНаша команда приступила к разработке нового вида существ: небольших, послушных и полезных. Первые прототипы уже летают, лечат друг друга и держатся от нас подальше.\n\nПрофессор доволен. Говорит, что эксперимент абсолютно безопасен.",en:"^REPORT No. 1\n\nOur team has started developing a new kind of creature: small, obedient and useful. The first prototypes already fly, heal each other and keep away from us.\n\nThe Professor is pleased. He says the experiment is completely safe."},
{id:18,l:6,n:2,ru:"^ОТЧЁТ №7\n\nЭксперимент не удался. Существа вышли из-под контроля, турели стреляют по своим, дроны никого не слушаются. Профессор заперся в главном зале и не отвечает.\n\nПишу это, пока ещё могу. Они уже у двери. Замок не выдержит, я слышу, как он лопа",en:"^REPORT No. 7\n\nThe experiment has failed. The creatures are out of control, the turrets shoot their own, the drones obey no one. The Professor has locked himself in the main hall and does not answer.\n\nI am writing this while I still can. They are already at the door. The lock will not hold, I can hear it crac"},
{id:19,l:6,n:3,ru:"Почему дверь в главную лабораторию не открывается?",en:"Why does the door to the main laboratory not open?"}];
